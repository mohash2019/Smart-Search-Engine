<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Search Engine</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef3ff;font-family:Arial,Tahoma,sans-serif}
.container{max-width:1200px;margin:auto;padding:20px}.hero{text-align:center;padding:20px}.hero h1{margin:0 0 8px;font-size:34px}.muted{color:#9eabc4}
.card{background:#121a2d;border:1px solid #293856;border-radius:18px;padding:18px;margin:14px 0}
.search{display:grid;grid-template-columns:1fr auto;gap:10px}.input,select{width:100%;background:#0c1426;color:#fff;border:1px solid #334563;border-radius:10px;padding:12px}
button{border:0;border-radius:10px;padding:11px 16px;background:#4f8cff;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#263653}.danger{background:#d94b4b}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.source{border:1px solid #293856;border-radius:12px;padding:12px;margin:8px 0;background:#0d1629;display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{display:inline-block;background:#203457;color:#c7dcff;border-radius:99px;padding:4px 9px;font-size:12px;margin:2px}.ok{color:#86efac}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.result{background:#0e172a;border:1px solid #293856;border-radius:14px;overflow:hidden}.thumb{width:100%;height:175px;object-fit:cover;background:#07101e;display:grid;place-items:center;color:#60708d;font-size:40px}.body{padding:13px}.title{font-weight:700;line-height:1.5}.desc{color:#b8c3d8;font-size:13px;line-height:1.5;margin:8px 0}.empty{text-align:center;color:#9eabc4;padding:35px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.modalbox{width:min(620px,100%);background:#121a2d;border:1px solid #344766;border-radius:18px;padding:20px;max-height:90vh;overflow:auto}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;color:#cbd5e1}.help{font-size:12px;color:#94a3b8;margin-top:5px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.search{grid-template-columns:1fr}.source{align-items:flex-start;flex-direction:column}}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<section class="hero"><h1>🔎 Smart Search Engine</h1><div class="muted">محرك بحث متعدد المصادر مع إدارة مصادر كاملة</div></section>

<section class="card">
<div class="search"><input id="q" class="input" placeholder="اكتب كلمة البحث..."><button onclick="runSearch()">بحث</button></div>
<div class="row" style="margin-top:10px">
<label class="check"><input id="keepDup" type="checkbox" checked> الاحتفاظ بالمكرر</label>
<select id="sort" class="input" style="width:auto"><option value="relevance">الأكثر صلة</option><option value="date">الأحدث</option><option value="duration">المدة</option></select>
<button class="secondary" onclick="clearResults()">مسح النتائج</button>
</div>
</section>

<section class="card">
<div class="row" style="justify-content:space-between"><h3>مصادر البحث</h3><button onclick="openAdd()">+ إضافة موقع</button></div>
<div id="sources"></div>
<div class="muted">يمكن إضافة YouTube أو Google أو أي JSON API متوافق.</div>
</section>

<section class="card">
<h3>الفلاتر</h3>
<div class="grid">
<label>المدة من<input id="minDur" class="input" type="number" min="0"></label>
<label>المدة إلى<input id="maxDur" class="input" type="number" min="0"></label>
<label>التاريخ من<input id="from" class="input" type="date"></label>
<label>التاريخ إلى<input id="to" class="input" type="date"></label>
</div>
</section>

<section class="card">
<div class="row" style="justify-content:space-between"><h3>النتائج <span id="count" class="badge">0</span></h3><span id="status" class="muted"></span></div>
<div id="results" class="results"><div class="empty">اكتب كلمة بحث ثم اضغط بحث.</div></div>
</section>
</div>

<div id="modal" class="modal">
<div class="modalbox">
<h2 id="modalTitle">إضافة موقع بحث</h2>
<div class="field"><label>اسم الموقع *</label><input id="sName" class="input" placeholder="مثال: موقع الفيديو"></div>
<div class="field"><label>نوع المصدر *</label>
<select id="sType" class="input" onchange="typeChanged()">
<option value="json">JSON API</option><option value="youtube">YouTube API</option><option value="google">Google Programmable Search</option>
</select></div>
<div id="urlField" class="field"><label>رابط API *</label><input id="sUrl" class="input" placeholder="https://example.com/api/search"><div class="help">سيتم إرسال كلمة البحث في المعامل q.</div></div>
<div id="keyField" class="field"><label>API Key <span class="muted">(اختياري حسب المصدر)</span></label><input id="sKey" class="input" type="password" placeholder="المفتاح إذا كان مطلوبًا"></div>
<div id="cxField" class="field" style="display:none"><label>Google Search Engine ID (CX)</label><input id="sCx" class="input" placeholder="CX"></div>
<div class="field"><label class="check"><input id="sEnabled" type="checkbox" checked> تفعيل المصدر</label></div>
<div class="row"><button onclick="saveSource()">حفظ الموقع</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>
<div id="modalMsg" class="help"></div>
</div></div>

<script>
const defaults=[
{id:"youtube",name:"YouTube",type:"youtube",enabled:false,key:""},
{id:"google",name:"Google",type:"google",enabled:false,key:"",cx:""}
];
let sources=JSON.parse(localStorage.getItem("sse_sources_v3")||"null")||defaults;
let editId=null,results=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function store(){localStorage.setItem("sse_sources_v3",JSON.stringify(sources));renderSources()}
function renderSources(){
 $("sources").innerHTML=sources.length?sources.map(s=>`
 <div class="source">
 <div><b>${esc(s.name)}</b><br><span class="badge">${esc(s.type)}</span> <span class="${s.enabled?"ok":"muted"}">${s.enabled?"● مفعّل":"● متوقف"}</span></div>
 <div class="row">
 <button class="secondary" onclick="toggleSource('${s.id}')">${s.enabled?"تعطيل":"تفعيل"}</button>
 <button class="secondary" onclick="editSource('${s.id}')">تعديل</button>
 <button class="secondary" onclick="testSource('${s.id}')">اختبار</button>
 ${s.id.startsWith("custom_")?`<button class="danger" onclick="deleteSource('${s.id}')">حذف</button>`:""}
 </div></div>`).join(""):"<div class='empty'>لا توجد مصادر.</div>";
}
function openAdd(){editId=null;clearForm();$("modalTitle").textContent="إضافة موقع بحث";$("modal").classList.add("show");typeChanged()}
function closeModal(){$("modal").classList.remove("show")}
function clearForm(){$("sName").value="";$("sType").value="json";$("sUrl").value="";$("sKey").value="";$("sCx").value="";$("sEnabled").checked=true;$("modalMsg").textContent=""}
function editSource(id){let s=sources.find(x=>x.id===id);if(!s)return;editId=id;$("modalTitle").textContent="تعديل موقع";$("sName").value=s.name;$("sType").value=s.type;$("sUrl").value=s.url||"";$("sKey").value=s.key||"";$("sCx").value=s.cx||"";$("sEnabled").checked=!!s.enabled;$("modal").classList.add("show");typeChanged()}
function typeChanged(){let t=$("sType").value;$("urlField").style.display=t==="json"?"block":"none";$("cxField").style.display=t==="google"?"block":"none";$("keyField").querySelector("label").innerHTML=t==="youtube"?"YouTube API Key *":t==="google"?"Google API Key *":"API Key (اختياري)"}
function saveSource(){
 let name=$("sName").value.trim(),type=$("sType").value,url=$("sUrl").value.trim(),key=$("sKey").value.trim(),cx=$("sCx").value.trim();
 if(!name){$("modalMsg").textContent="❌ اكتب اسم الموقع.";return}
 if(type==="json"&&!url){$("modalMsg").textContent="❌ اكتب رابط API.";return}
 if(type==="youtube"&&!key){$("modalMsg").textContent="❌ أضف YouTube API Key.";return}
 if(type==="google"&&(!key||!cx)){$("modalMsg").textContent="❌ أضف API Key و CX.";return}
 let data={name,type,url,key,cx,enabled:$("sEnabled").checked};
 if(editId)Object.assign(sources.find(x=>x.id===editId),data);else sources.push({id:"custom_"+Date.now(),...data});
 store();closeModal()
}
function toggleSource(id){let s=sources.find(x=>x.id===id);s.enabled=!s.enabled;store()}
function deleteSource(id){if(confirm("حذف الموقع؟")){sources=sources.filter(s=>s.id!==id);store()}}
async function testSource(id){
 let s=sources.find(x=>x.id===id);$("status").textContent="جارٍ اختبار "+s.name+"...";
 if(s.type==="json"){$("status").textContent=s.url?"✅ تم حفظ إعدادات رابط JSON":"❌ رابط API غير موجود";return}
 if(s.type==="google"){$("status").textContent=s.key&&s.cx?"✅ API Key وCX موجودان":"❌ أضف API Key وCX";return}
 if(!s.key){$("status").textContent="❌ YouTube API Key غير موجود";return}
 try{let d=await fetch("https://www.googleapis.com/youtube/v3/search?"+new URLSearchParams({part:"snippet",q:"test",type:"video",maxResults:"1",key:s.key})).then(r=>r.json());$("status").textContent=d.error?"❌ "+d.error.message:"✅ اتصال YouTube يعمل"}catch(e){$("status").textContent="❌ "+e.message}
}
function iso(s){if(!s)return 0;let m=s.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);return m?((+m[1]||0)*60+(+m[2]||0)+(+m[3]||0)/60):0}
async function yt(q,s){
 if(!s.key)throw Error("YouTube API Key غير مضاف");
 let a=await fetch("https://www.googleapis.com/youtube/v3/search?"+new URLSearchParams({part:"snippet",q,type:"video",maxResults:"50",key:s.key})).then(r=>r.json());
 if(a.error)throw Error(a.error.message);let ids=(a.items||[]).map(x=>x.id.videoId).filter(Boolean).join(",");if(!ids)return[];
 let d=await fetch("https://www.googleapis.com/youtube/v3/videos?"+new URLSearchParams({part:"contentDetails,snippet",id:ids,key:s.key})).then(r=>r.json());
 return(d.items||[]).map(x=>({title:x.snippet.title,url:"https://www.youtube.com/watch?v="+x.id,thumb:x.snippet.thumbnails?.high?.url||"",source:s.name,date:x.snippet.publishedAt,duration:iso(x.contentDetails?.duration),description:x.snippet.description||""}))
}
async function google(q,s){
 if(!s.key||!s.cx)throw Error("Google API Key وCX مطلوبان");
 let d=await fetch("https://www.googleapis.com/customsearch/v1?"+new URLSearchParams({key:s.key,cx:s.cx,q,searchType:"video",num:"10"})).then(r=>r.json());if(d.error)throw Error(d.error.message);
 return(d.items||[]).map(x=>({title:x.title,url:x.link,thumb:x.pagemap?.cse_thumbnail?.[0]?.src||"",source:s.name,date:x.pagemap?.videoobject?.[0]?.uploaddate||"",description:x.snippet||""}))
}
async function jsonApi(q,s){
 if(!s.url)throw Error("رابط API غير موجود");let u=new URL(s.url);u.searchParams.set("q",q);let h={Accept:"application/json"};if(s.key)h.Authorization="Bearer "+s.key;
 let d=await fetch(u,{headers:h}).then(r=>r.json()),a=d.results||d.items||d.data;if(!Array.isArray(a))throw Error("يجب أن يعيد API results أو items أو data");
 return a.map(x=>({title:x.title||x.name||"بدون عنوان",url:x.url||x.link||"#",thumb:x.thumbnail||x.image||"",source:s.name,date:x.date||x.publishedAt||"",duration:Number(x.duration||0),description:x.description||x.snippet||""}))
}
async function runSearch(){
 let q=$("q").value.trim();if(!q)return;let active=sources.filter(s=>s.enabled);if(!active.length){$("status").textContent="❌ فعّل مصدرًا واحدًا على الأقل.";return}
 $("status").textContent="جارٍ البحث...";let all=[],err=[];
 for(let s of active)try{all.push(...(s.type==="youtube"?await yt(q,s):s.type==="google"?await google(q,s):await jsonApi(q,s)))}catch(e){err.push(s.name+": "+e.message)}
 results=all;renderResults();$("status").textContent=err.length?"تم مع أخطاء: "+err.join(" | "):"تم البحث بنجاح"
}
function renderResults(){
 let a=[...results],min=Number($("minDur").value||0),max=Number($("maxDur").value||Infinity),from=$("from").value,to=$("to").value;
 a=a.filter(x=>(!x.duration||x.duration>=min)&&(!x.duration||x.duration<=max)&&(!from||!x.date||x.date.slice(0,10)>=from)&&(!to||!x.date||x.date.slice(0,10)<=to));
 if(!$("keepDup").checked){let seen=new Set();a=a.filter(x=>{let k=x.url||x.title;if(seen.has(k))return false;seen.add(k);return true})}
 if($("sort").value==="date")a.sort((x,y)=>new Date(y.date||0)-new Date(x.date||0));if($("sort").value==="duration")a.sort((x,y)=>(x.duration||0)-(y.duration||0));
 $("count").textContent=a.length;$("results").innerHTML=a.length?a.map(x=>`<article class="result">${x.thumb?`<img class="thumb" src="${esc(x.thumb)}">`:`<div class="thumb">▶</div>`}<div class="body"><div class="title">${esc(x.title)}</div><span class="badge">${esc(x.source)}</span><div class="desc">${esc(x.description)}</div><div class="muted">${x.date?esc(x.date.slice(0,10)):"تاريخ غير متاح"}</div><div style="margin-top:10px"><a href="${esc(x.url)}" target="_blank" rel="noopener"><button>فتح النتيجة</button></a></div></div></article>`).join(""):"<div class='empty'>لا توجد نتائج.</div>"
}
function clearResults(){results=[];renderResults();$("status").textContent=""}
["minDur","maxDur","from","to","sort","keepDup"].forEach(id=>$(id).addEventListener("change",renderResults));
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")runSearch()});
renderSources();renderResults();
</script>
</body>
</html>
